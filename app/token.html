<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token · Pangea</title>
  <link rel="icon" href="../logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <script src="../js/theme.js"></script>
</head>
<body>
  <div class="app" data-page="token">
    <aside class="app-side"></aside>
    <main class="app-main">
      <div class="app-top"></div>
      <article class="panel" id="card" style="max-width:760px"></article>
    </main>
  </div>
  <script src="../js/mark.js"></script>
  <script src="../js/coins.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id") || "pangea";
    const coin = window.PANGEA_COINS.find((item) => item.id === id) || window.PANGEA_COINS[0];
    document.title = coin.name + " · Pangea";
    const sign = coin.chg > 0 ? "+" : "";
    document.getElementById("card").innerHTML = `
      <div class="coin-head">
        <div class="avatar" style="width:52px;height:52px;background:${coin.color};color:${coin.ink || "#17131c"}">${coin.tick}</div>
        <div><strong style="font-size:28px">${coin.name}</strong><em> $${coin.symbol}</em></div>
      </div>
      <p class="page-lede" style="margin-top:16px">${coin.chains} of 5 chains live · ${coin.chain} ${coin.addr}</p>
      <div class="stats">
        <div>Price<b>${coin.price}</b></div>
        <div>Market cap<b>${window.pangeaMoney(coin.mcap)}</b></div>
        <div>24h<b>${sign}${coin.chg.toFixed(2)}%</b></div>
        <div>Traded in 24h<b>${window.pangeaMoney(coin.vol)}</b></div>
        <div>In pools<b>${window.pangeaMoney(coin.pools)}</b></div>
        <div>Bought<b>${coin.bought}%</b></div>
      </div>
      <p style="margin-top:18px"><a class="primary" style="display:inline-flex;align-items:center;text-decoration:none" href="bridge.html?token=${coin.id}">Bridge this coin</a></p>`;
  </script>
</body>
</html>
